<title>Ledgerwatch AML</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: sticky top bar with view tabs. Alerts = queue + detail split; Network = full-width canvas + node panel; SMR = drafting desk with sign-off rail. */
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F8F9; --line:#D6DFE2; --fg:#14232A; --muted:#58707A;
  --accent:#0C6575; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --crit:#B3261E; --crit-bg:#FBE4E1; --high:#B04E00; --high-bg:#FCE9D8; --med:#7A5F00; --med-bg:#F6EDC9;
  --low:#4A5E66; --low-bg:#E3EAEC; --ok:#2E6B45; --ok-bg:#DDEFE3;
  --font-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#151D21; --surface-2:#1A252A; --line:#2B3A41; --fg:#E4ECEF; --muted:#8FA4AC;
  --accent:#56B6C6; --accent-ink:#04252B; --accent-soft:#13343B;
  --crit:#FF8F86; --crit-bg:#3A1A18; --high:#FFA45C; --high-bg:#3A2412; --med:#E8CB5C; --med-bg:#352E0E;
  --low:#9DB0B7; --low-bg:#222E33; --ok:#7FD39B; --ok-bg:#16301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#151D21; --surface-2:#1A252A; --line:#2B3A41; --fg:#E4ECEF; --muted:#8FA4AC;
  --accent:#56B6C6; --accent-ink:#04252B; --accent-soft:#13343B;
  --crit:#FF8F86; --crit-bg:#3A1A18; --high:#FFA45C; --high-bg:#3A2412; --med:#E8CB5C; --med-bg:#352E0E;
  --low:#9DB0B7; --low-bg:#222E33; --ok:#7FD39B; --ok-bg:#16301F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.25}
h2{font-size:18px}h3{font-size:14px}
.mono,.cite,td.id,pre,.num{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding-block:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;max-width:100%}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--fg)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav .ct{font-family:var(--font-mono);font-size:11px;margin-left:5px;opacity:.85}
main{padding-block:20px 8px;display:grid;gap:16px}
.foot{padding-block:16px 28px;color:var(--muted);font-size:12px}

.strip{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.strip div{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.strip div:last-child{border-right:0}
.strip b{display:block;font:500 22px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted)}

.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.pad{padding:14px 16px}
.scroll{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px}
select,input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.id{font-size:12.5px;white-space:nowrap}
.q tbody tr{cursor:pointer}
.q tbody tr:hover{background:var(--surface-2)}
.q tbody tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sub{display:block;color:var(--muted);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sev-critical{color:var(--crit);background:var(--crit-bg)}.sev-high{color:var(--high);background:var(--high-bg)}
.sev-medium{color:var(--med);background:var(--med-bg)}.sev-low{color:var(--low);background:var(--low-bg)}
.st-new{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.st-investigating{color:var(--accent);background:var(--accent-soft)}
.st-drafted{color:var(--med);background:var(--med-bg)}
.st-ready{color:var(--ok);background:var(--ok-bg)}
.st-closed{color:var(--low);background:var(--low-bg)}
.hit-pep,.hit-sanction{color:var(--crit);background:var(--crit-bg)}.hit-clear{color:var(--ok);background:var(--ok-bg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 10px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.tot td{font-weight:600;background:var(--surface-2)}
#detail{scroll-margin-top:70px}

pre{margin:6px 0 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre}
.step{padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}
.step .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.step .h b{font-weight:600}.step .res{margin-top:6px;font-size:12.5px;color:var(--ok)}

.graphbox{overflow-x:auto}
svg.graph{display:block;min-width:700px;width:100%;height:auto;color:var(--muted)}
.graph .edge line{stroke:var(--muted);opacity:.75}.graph .edge.dim{opacity:.15}
.graph .elab{font:500 11px var(--font-mono);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;text-anchor:middle}
.graph .node{cursor:pointer}.graph .node circle{stroke:var(--muted);stroke-width:1.5;fill:var(--surface)}
.graph .node.customer circle{fill:var(--accent);stroke:var(--accent)}
.graph .node.cash circle{fill:var(--low-bg);stroke:var(--low)}
.graph .node.shell circle,.graph .node.exchange circle{stroke:var(--high);stroke-width:2.5}
.graph .node.hit circle{stroke:var(--crit);stroke-width:3.5}
.graph .node.sel circle{stroke:var(--fg);stroke-width:3}
.graph .node text{font:500 12px var(--font-ui);fill:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:2px solid var(--muted);vertical-align:-1px}

.desk{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:16px;align-items:start}
.rail button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer}
.rail button.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}
.sec label{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:4px}
.sec label small{font-weight:400;color:var(--muted)}
.ed{min-height:3em;line-height:1.7;border-radius:6px;padding:6px 8px;margin:0 -8px;outline:0}
.ed:focus{background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.cite{display:inline-block;font-size:11px;line-height:1.35;padding:0 6px;margin:0 1px;border-radius:4px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);white-space:nowrap;vertical-align:1px}
.cite-note{color:var(--muted);font-size:12px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.chk input{margin-top:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tier{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:stretch;margin-bottom:8px}
.tier>b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}
.tier .bx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tier .bx div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-2);font-size:13px}
.tier .bx div small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:20}

@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.desk{grid-template-columns:minmax(0,1fr)}.rail{display:flex;overflow-x:auto}.rail button{width:auto;white-space:nowrap;border-bottom:0}}
@media (max-width:640px){.hm{display:none}.tier{grid-template-columns:1fr}.tier>b{padding-top:0}.strip div{flex-basis:45%}}
@media (prefers-reduced-motion:no-preference){.q tbody tr{transition:background .12s}}
</style>
<div class="top"><div class="wrap">
  <div class="brand">Ledgerwatch <small>AML monitoring</small></div>
  <nav id="nav" aria-label="Views">
    <a href="#alerts" data-v="alerts">Alerts <span class="ct" id="ctAlerts"></span></a>
    <a href="#network" data-v="network">Network</a>
    <a href="#smr" data-v="smr">SMR studio</a>
    <a href="#rules" data-v="rules">Rules &amp; agents</a>
    <a href="#audit" data-v="audit">Audit log</a>
  </nav>
</div></div>
<div class="wrap"><main id="app"></main>
<div class="foot">All customers, accounts, counterparties and transactions on this site are synthetic. Agent steps and narratives are scripted for the prototype; nothing is sent to a regulator.</div></div>
<div id="toast" class="toast" hidden></div>
