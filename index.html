nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--fg)}
nav a.on{background:var(--accent-soft);color:var(--accent)}

.foot{padding-block:16px 28px;color:var(--muted);font-size:12px}

.strip{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}

.strip span{font-size:12px;color:var(--muted)}

.scroll{overflow-x:auto}

.st-ready{color:var(--ok);background:var(--ok-bg)}

.hit-pep,.hit-sanction{color:var(--crit);background:var(--crit-bg)}.hit-clear{color:var(--ok);background:var(--ok-bg)}

.muted{color:var(--muted)}

  else if(t.id==='af'){S.af=t.value;render(true)}
  else if(t.id==='ar'){S.ar=t.value;render(true)}
  else if(t.dataset&&t.dataset.chk!==undefined){S.sign[S.sel].c[+t.dataset.chk]=t.checked;updSign()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='officer'){S.sign[S.sel].name=t.value;updSign()}
  const sec=t.closest&&t.closest('[data-sec]');
  if(sec){const d=S.drafts[S.sel];d.sections[sec.dataset.sec]=sec.innerHTML;d.edited[sec.dataset.sec]=true;updCites()}
});
window.addEventListener('hashchange',route);
route();
})();
</script>
